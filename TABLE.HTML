<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border-collapse: collapse;
            text-align: center;
            width: 330px;
        }
        thead{
            background-color: rgb(155, 206, 229);
        }
        tbody{
            background-color: rgb(200, 247, 228);
        }
        tfoot{
            background-color: rgb(241, 209, 227);
        }     
    </style>
</head>
<body>
    <table border="2">
        <thead>
            <tr>
                <th>product</th>
                <th>Quantity</th>
                <th>Unit Price</th>
                <th>Total price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop</td>
                <td>2</td>
                <td>50000</td>
                <td>100000</td>
            </tr>
            <tr>
                <td>Mouse</td>
                <td>5</td>
                <td>500</td>
                <td>2500</td>
            </tr>
            <tr>
                <td>Keyboard</td>
                <td>3</td>
                <td>800</td>
                <td>2400</td>
            </tr>
            <tr>
                <td>Monitor</td>
                <td>2</td>
                <td>7000</td>
                <td>14000</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                 <td>Grand Total</td>
                 <td>12</td>
                 <td></td>
                 <td>114900</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>

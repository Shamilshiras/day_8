<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border-collapse: collapse;
            text-align: center;
        }
        th{
           background-color: rgb(216, 201, 229);
        }
        #name{
            background-color: rgb(202, 214, 227);
        }
        td{
            background-color: rgb(223, 234, 221);
        }
    </style>
</head>
<body>
    <table border="2">
        <tr>
            <th>student</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td id="name" rowspan="3">Alice</td>
            <td>Maths</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>92</td>
        </tr>
        <tr>
            <td>English</td>
            <td>78</td>
        </tr>
        <tr>
            <td id="name" rowspan="2">Bob</td>
            <td>Maths</td>
            <td>88</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>92</td>
        </tr>
    </table>
    
</body>
</html>
